[package]
name = "smile_id"
version = "0.1.0"
edition = "2024"
authors = ["Nutcase <mauricee423@gmail.com>"]
description = "Rust client for Smile ID's identity verification services across Africa"
license = "MIT"

repository = "https://github.com/nutcas3/smile-id-rust"
readme = "README.md"
keywords = ["identity", "verification", "kyc", "africa", "smile-id"]
categories = ["api-bindings", "authentication"]

[dependencies]
reqwest = { version = "0.13.1", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
chrono = "0.4.42"
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["full"], optional = true }
url = "2.5.7"

[features]
default = ["async"]
async = ["tokio"]
blocking = []

[dev-dependencies]
tokio-test = "0.4.4"
mockito = "1.7.1"
